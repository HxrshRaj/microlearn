name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: microlearn
          POSTGRES_PASSWORD: microlearn
          POSTGRES_DB: microlearn_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U microlearn" --health-interval 5s --health-timeout 5s --health-retries 10
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build NestJS port
        run: cd nest && npm ci && npm run build

      - name: Contract test - same integration suite against the NestJS port
        run: MICROLEARN_IMPL=nest npx jest tests/integration

      - name: NestJS end-to-end on real PostgreSQL
        run: E2E_DATABASE_URL=postgres://microlearn:microlearn@localhost:5432/microlearn_e2e npx jest tests/e2e

  mern:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    defaults:
      run:
        working-directory: mern
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: |
            mern/package-lock.json
            mern/client/package-lock.json
      - run: npm ci
      - name: API tests (real MongoDB)
        run: MONGO_URI=mongodb://127.0.0.1:27017 npm test
      - name: Build React + Tailwind client
        run: npm --prefix client ci && npm --prefix client run build

  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ml
          POSTGRES_PASSWORD: ml
          POSTGRES_DB: ml_django
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ml" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: django
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: django/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests on SQLite
        run: pytest -q
      - name: Tests on PostgreSQL (includes the concurrency test)
        run: pytest -q
        env:
          DATABASE_URL: postgres://ml:ml@localhost:5432/ml_django
      - name: Build image and smoke test
        run: |
          docker build -t microlearn-django .
          docker run -d --name ml -p 8000:8000 -e DJANGO_SECRET_KEY=ci -e DJANGO_INSECURE_COOKIES=1 microlearn-django
          for i in $(seq 1 30); do curl -sf localhost:8000/api/leaderboard && break; sleep 1; done
          curl -sf localhost:8000/ | grep -q "Django"
