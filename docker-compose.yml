services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: microlearn
      POSTGRES_PASSWORD: microlearn
      POSTGRES_DB: microlearn
    ports:
      - "5432:5432"
    volumes:
      - microlearn-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microlearn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  microlearn-db-data:
