<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MicroLearn (Django edition)</title>
<style>
:root{--bg:#f6f7f9;--fg:#14181f;--muted:#5b6573;--line:#dfe3ea;--card:#fff;--accent:#1f4fd8;--ok:#1f8a4c;--bad:#c93232}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--fg:#e8ebf1;--muted:#9aa4b2;--line:#272d38;--card:#171c25;--accent:#6c93ff}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:16px}
h1{margin:0;font-size:22px}.tag{color:var(--muted);font-size:13px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
button{font:inherit;padding:7px 12px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
input{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.muted{color:var(--muted);font-size:13px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:10px;padding:1px 8px}.done{color:var(--ok)}
.opt{display:block;width:100%;text-align:left;margin:4px 0}.opt.right{border-color:var(--ok)}.opt.wrong{border-color:var(--bad)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:6px}.live.on{background:var(--ok)}
ol{padding-left:20px;margin:6px 0}#msg{color:var(--bad);min-height:20px}
</style>
</head>
<body>
<header><div><h1>MicroLearn</h1><span class="tag">Django · DRF · Channels edition</span></div><div id="who"></div></header>
<p id="msg" role="alert"></p>
<section id="auth" class="card">
  <div class="row" style="justify-content:flex-start;flex-wrap:wrap">
    <input id="u" placeholder="username" autocomplete="username"><input id="p" type="password" placeholder="password (8+ chars)" autocomplete="current-password">
    <button class="primary" id="login">Log in</button><button id="signup">Sign up</button>
  </div>
</section>
<div class="grid">
  <main id="main"></main>
  <aside><div class="card"><div class="row"><strong>Leaderboard</strong><span class="muted"><span id="dot" class="live"></span><span id="live">connecting</span></span></div><ol id="lb"></ol></div>
  <div class="card" id="me"></div></aside>
</div>
<script>
let token = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const say = (t) => ($("msg").textContent = t || "");
async function api(path, opts = {}) {
  const r = await fetch("/api/" + path, {...opts, headers: {"Content-Type": "application/json", ...(token ? {Authorization: "Token " + token} : {})}});
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(Object.values(body).flat().join(" ") || r.statusText);
  return body;
}
async function authenticate(kind) {
  try {
    const d = await api("auth/" + kind, {method: "POST", body: JSON.stringify({username: $("u").value, password: $("p").value})});
    token = d.token; $("auth").hidden = true; $("who").textContent = d.username; say(""); await refresh();
  } catch (e) { say(e.message); }
}
$("login").onclick = () => authenticate("login");
$("signup").onclick = () => authenticate("signup");
function renderBoard(rows) {
  $("lb").innerHTML = rows.map((r) => `<li>${esc(r.username)} <span class="muted">${r.total_xp} XP</span></li>`).join("") || '<li class="muted">No learners yet</li>';
}
function connect() {
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/leaderboard/");
  ws.onopen = () => { $("dot").classList.add("on"); $("live").textContent = "live"; };
  ws.onmessage = (e) => renderBoard(JSON.parse(e.data).rows);
  ws.onclose = () => { $("dot").classList.remove("on"); $("live").textContent = "reconnecting"; setTimeout(connect, 2000); };
}
async function refresh() {
  const [lessons, me] = await Promise.all([api("lessons"), api("me")]);
  $("me").innerHTML = `<strong>${esc(me.username)}</strong><div class="muted">${me.total_xp} XP · streak ${me.current_streak} (best ${me.longest_streak}) · ${me.lessons_completed} lessons done</div>`;
  $("main").innerHTML = lessons.results.map((l) => `<div class="card"><div class="row"><div><strong>${esc(l.title)}</strong> <span class="chip">${esc(l.category)}</span>
    ${l.completed ? '<span class="done">✓ best ' + l.best_score + "/" + l.question_count + "</span>" : ""}</div><button data-id="${l.id}">${l.completed ? "Retake" : "Start"} (+${l.xp_reward} XP)</button></div>
    <div class="muted">${esc(l.summary)}</div><div class="quiz" id="q${l.id}"></div></div>`).join("");
  document.querySelectorAll("#main button[data-id]").forEach((b) => (b.onclick = () => openQuiz(b.dataset.id)));
}
async function openQuiz(id) {
  const l = await api("lessons/" + id), box = $("q" + id), picks = l.questions.map(() => null);
  box.innerHTML = l.questions.map((q, i) => `<div><p><strong>${esc(q.prompt)}</strong></p>` +
    q.options.map((o, j) => `<button class="opt" data-q="${i}" data-o="${j}">${esc(o)}</button>`).join("") + "</div>").join("") +
    '<button class="primary" id="s' + id + '">Submit</button>';
  box.querySelectorAll(".opt").forEach((b) => (b.onclick = () => {
    picks[b.dataset.q] = +b.dataset.o;
    box.querySelectorAll(`.opt[data-q="${b.dataset.q}"]`).forEach((x) => x.classList.toggle("right", x === b));
  }));
  $("s" + id).onclick = async () => {
    if (picks.includes(null)) return say("Answer every question first.");
    try {
      const r = await api(`lessons/${id}/submit`, {method: "POST", body: JSON.stringify({answers: picks})});
      say(""); box.innerHTML = `<p><strong>${r.score}/${r.total}</strong> correct · +${r.xp_awarded} XP · streak ${r.current_streak}</p>`; refresh();
    } catch (e) { say(e.message); }
  };
}
connect();
</script>
</body>
</html>
